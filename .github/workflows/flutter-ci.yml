name: flutter-ci

on:
  push:
    paths:
      - "apps/web/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/flutter-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
