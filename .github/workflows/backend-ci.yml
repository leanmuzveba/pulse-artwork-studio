name: backend-ci

on:
  push:
    paths:
      - "services/api/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql+asyncpg://pulse:pulse@localhost:5432/pulse
      JWT_SECRET: ci-only-secret-thirty-two-bytes-minimum-000
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: pulse-minio
      S3_SECRET_KEY: pulse-minio-secret
      S3_BUCKET_ORIGINALS: pulse-originals
      S3_BUCKET_DERIVED: pulse-derived
      S3_BUCKET_EXPORTS: pulse-exports
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO (object storage)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=pulse-minio \
            -e MINIO_ROOT_PASSWORD=pulse-minio-secret \
            minio/minio server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/ready; then echo "minio ready"; break; fi
            sleep 2
          done
          docker run --rm --network host --entrypoint sh minio/mc -c "
            mc alias set local http://localhost:9000 pulse-minio pulse-minio-secret &&
            mc mb -p local/pulse-originals local/pulse-derived local/pulse-exports"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: pytest -q
