name: worker-ci

on:
  push:
    paths:
      - "services/worker/**"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    paths:
      - "services/worker/**"
      - ".github/workflows/worker-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
