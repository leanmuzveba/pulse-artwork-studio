[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-api"
version = "0.1.0"
description = "Pulse Artwork Studio AI — FastAPI service (auth, projects, artworks, processing, exports)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    # Data layer
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Auth
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    # Object storage + job enqueue
    "boto3>=1.34",
    "redis>=5.0",
    "celery>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# B008: FastAPI's `Depends(...)` as a parameter default is the framework's
# documented idiom, not a real mutable-default bug — ruff's own docs list
# this exact ignore for FastAPI projects.
# UP042: app/db/enums.py deliberately mixes `str` for storage/serialization
# compatibility (see its module docstring); `StrEnum`'s `str()` semantics
# differ, so swapping bases is a behavior change, not a style fix.
# UP046: `Generic[T]` (not PEP 695 type params) is used for broad tooling
# compatibility with the rest of the Pydantic v2 codebase.
ignore = ["B008", "UP042", "UP046"]

[tool.pytest.ini_options]
testpaths = ["tests"]
